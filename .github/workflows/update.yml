name: update-offers

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrapen
        env:
          STORE_URL: ${{ secrets.STORE_URL }}
          OFFERS_URL: ${{ secrets.OFFERS_URL }}
          TILE_SELECTOR: ${{ secrets.TILE_SELECTOR }}
          CARD_MARKER: ${{ secrets.CARD_MARKER }}
        run: python scraper.py

      - name: Speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/offers.json
          git diff --staged --quiet || (git commit -m "Angebote aktualisiert" && git push)

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug
          path: debug.html